services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fleetflow
      POSTGRES_PASSWORD: fleetflow_local
      POSTGRES_DB: fleetflow
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  osrm:
    image: osrm/osrm-backend
    restart: unless-stopped
    # Requires preprocessed data first — run scripts/setup-osrm.sh once.
    #
    # Currently pointed at Berlin (a small Germany sub-region) because a
    # full-Germany extract needs more RAM than this machine's Docker Desktop
    # had allocated. To switch to full Germany once you've raised Docker's
    # memory limit (Settings -> Resources), run:
    #   REGION=germany ./scripts/setup-osrm.sh
    # (the .osm.pbf is already downloaded in osrm-data/) then change the path
    # below to /data/germany-latest.osrm.
    command: osrm-routed --algorithm mld /data/berlin-latest.osrm
    ports:
      - "5001:5000"
    volumes:
      - ./osrm-data:/data

volumes:
  postgres_data:
