services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fleetflow
      POSTGRES_PASSWORD: fleetflow_local
      POSTGRES_DB: fleetflow
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
